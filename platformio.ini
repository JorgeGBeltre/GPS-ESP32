[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DMQTT_MAX_PROPS=32
    -DMQTT_DEFAULT_BUFFER_SIZE=4096
    -I src
    -I src/Infrastructure/Config
    -I .
    -I "${sysenv.USERPROFILE}/.platformio/packages/framework-arduinoespressif32/libraries/Wire/src"
lib_deps = 
    Wire
    bblanchon/ArduinoJson @ ^6.21.0
    https://github.com/tzapu/WiFiManager.git
    https://github.com/JorgeGBeltre/ESP32_MQTTv5.git
    https://github.com/JorgeGBeltre/MQTTOTAv5.git
    h2zero/NimBLE-Arduino @ ^1.4.1
    mikalhart/TinyGPSPlus @ ^1.0.3
    electroniccats/MPU6050 @ ^1.3.1

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 460800
upload_port = COM5

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = 
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
